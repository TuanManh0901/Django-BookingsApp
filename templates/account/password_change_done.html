{% extends "base.html" %}
{% load i18n %}

{% block title %}{% trans "Password Changed" %} - VN Travel{% endblock %}

{% block content %}
<!-- Threeland Hero - Mini -->
<div class="threeland-hero" style="min-height: 60vh;">
  <div class="hero-background-image" style="background-image: url('https://images.unsplash.com/photo-1476514525535-07fb3b4ae5f1?w=1920&q=80');"></div>
  <div class="hero-overlay"></div>
  
  <div class="hero-main-content">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8">
          
          <div class="card bg-white shadow border-0 text-center">
            <div class="card-body px-lg-5 py-lg-5">
              <div class="mb-4">
                <div style="width: 80px; height: 80px; background: #2dce89; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto;">
                    <i class="ni ni-check-bold text-white" style="font-size: 40px;"></i>
                </div>
              </div>
              
              <h2 class="h3 mb-3">Đổi mật khẩu thành công!</h2>
              <p class="text-muted mb-4">Mật khẩu của bạn đã được cập nhật. Vui lòng sử dụng mật khẩu mới cho lần đăng nhập tiếp theo.</p>
              
              <a href="{% url 'user_profile' %}" class="btn btn-success btn-lg w-100">
                  <i class="ni ni-single-02 me-2"></i>Về Trang Hồ Sơ
              </a>
            </div>
          </div>
          
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
